<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fde-token" content="__FDE_TOKEN__">
<title>FDE-Mode 상황판</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">FDE<span>-Mode</span></div>
  <select id="project" title="프로젝트"></select>
  <div id="phase" class="phase">…</div>
  <div id="clock" class="clock"></div>
  <div class="spacer"></div>
  <label class="auto"><input type="checkbox" id="auto" checked> 자동 새로고침</label>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="on">개요</button>
  <button data-tab="convo" id="tab-convo">대화</button>
  <button data-tab="cards">질문 카드</button>
  <button data-tab="decisions">결정</button>
  <button data-tab="reports">보고서</button>
  <button data-tab="requirements">요구사항</button>
  <button data-tab="persona">인물 패턴</button>
  <button data-tab="debates">토론</button>
  <button data-tab="data">데이터</button>
  <button data-tab="build">구현</button>
  <button data-tab="org">조직 현황</button>
  <button data-tab="transcript">발화 표</button>
  <button data-tab="events">기록</button>
</nav>
<main id="view"><p class="muted">불러오는 중…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
<script src="/static/convo.js"></script>
</body>
</html>
