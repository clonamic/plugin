<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 설계 편집기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside id="left">
  <div class="left-head">
    <strong>프로젝트</strong>
    <div class="row">
      <button id="new-project" type="button">새 프로젝트</button>
      <button id="import-project" type="button">가져오기</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
  <ul id="projects" aria-label="프로젝트 목록"></ul>
</aside>

<main id="center">
  <header id="top">
    <div class="title-row">
      <input id="project-name" aria-label="프로젝트 이름" placeholder="프로젝트 이름" disabled>
      <span id="save-state" aria-live="polite"></span>
      <div id="actions" class="row"></div>
    </div>
    <nav id="crumb" aria-label="위치"></nav>
    <div id="tools" class="row"></div>
  </header>
  <div id="cy" aria-label="설계 캔버스"></div>
  <div id="empty" class="empty">왼쪽에서 프로젝트를 고르거나 새로 만드세요.</div>
</main>

<aside id="right">
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="패널 폭 조절" title="끌어서 폭 조절"></div>
  <div class="tabs" role="tablist">
    <button id="tab-doc" role="tab" aria-selected="true" type="button">문서</button>
    <button id="tab-chat" role="tab" aria-selected="false" type="button">검토 <span id="unread" hidden>•</span></button>
  </div>
  <section id="panel-doc" role="tabpanel"></section>
  <section id="panel-chat" role="tabpanel" hidden>
    <div id="ai-state"></div>
    <div id="messages"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="3" placeholder="설계에 대해 묻거나 검토를 요청하세요. Enter 보내기, Shift+Enter 줄바꿈"></textarea>
      <button type="submit">보내기</button>
    </form>
  </section>
</aside>

<div id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"></div></div>

<script src="vendor/cytoscape-3.34.3.min.js"></script>
<script src="vendor/cytoscape-dagre-4.0.1.js"></script>
<script src="lodash-shim.js"></script>
<script src="vendor/cytoscape-edgehandles-4.0.1.js"></script>
<script src="app.js"></script>
</body>
</html>
