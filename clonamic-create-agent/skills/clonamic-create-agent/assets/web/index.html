<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>에이전트 설계 편집기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside id="left" aria-label="프로젝트">
  <div class="left-head">
    <h1 class="app-title">프로젝트</h1>
    <div class="row">
      <button id="new-project" type="button" class="primary small">새 프로젝트</button>
      <button id="import-project" type="button" class="small">가져오기</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
  <ul id="projects" aria-label="프로젝트 목록"></ul>
</aside>

<main id="center">
  <header id="top">
    <div class="title-row">
      <input id="project-name" aria-label="프로젝트 이름" placeholder="프로젝트 이름" disabled>
      <span id="save-state" aria-live="polite"></span>
      <div id="actions" class="row"></div>
    </div>
    <nav id="crumb" aria-label="위치"></nav>
    <ol id="steps" aria-label="진행 단계" hidden></ol>
  </header>
  <div id="stage">
    <div id="cy" tabindex="0" aria-label="설계 캔버스. +와 -로 확대·축소, 0으로 화면 맞춤"></div>
    <div id="cards" aria-hidden="true"><div id="cards-inner"></div></div>
    <svg id="drag-line" hidden aria-hidden="true"><path d=""/></svg>
    <div id="tip" class="float" hidden></div>
    <div id="tools" class="float capsule" role="toolbar" aria-label="캔버스 도구"></div>
    <div id="zoom" class="float stack" role="toolbar" aria-label="확대와 축소"></div>
    <div id="history" class="float capsule" role="toolbar" aria-label="되돌리기"></div>
    <div id="toast" class="float" role="status" aria-live="polite" hidden></div>
    <div id="canvas-empty" class="float empty-card" hidden></div>
  </div>
  <div id="empty" class="empty">왼쪽에서 프로젝트를 고르거나 새로 만드세요.</div>
</main>

<aside id="right" aria-label="문서와 검토">
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="패널 폭 조절" title="끌어서 폭 조절"></div>
  <div class="segmented" role="tablist" aria-label="오른쪽 패널">
    <button id="tab-doc" role="tab" aria-selected="true" type="button">문서</button>
    <button id="tab-chat" role="tab" aria-selected="false" type="button">검토 <span id="unread" class="dot" hidden aria-label="새 메시지"></span></button>
    <button id="tab-both" role="tab" aria-selected="false" type="button" title="문서와 검토를 위아래로 함께 봅니다">함께 보기</button>
  </div>
  <section id="panel-doc" role="tabpanel" aria-labelledby="tab-doc"></section>
  <section id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
    <div id="ai-state" role="status"></div>
    <div id="messages"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="2" aria-label="검토 메시지" placeholder="설계에 대해 묻거나 검토를 요청하세요"></textarea>
      <button type="submit" class="primary">보내기</button>
    </form>
  </section>
</aside>

<div id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"></div></div>

<script src="vendor/cytoscape-3.34.3.min.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
